# Render Blueprint for the Digital Bridge API (free plan).
# Render dashboard: New > Blueprint > pick this repository. Fill in the values marked sync: false.
services:
  - type: web
    name: digital-bridge-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # pnpm comes from npm: the corepack bundled with Node 22.12 has outdated signing keys and cannot download pnpm.
    buildCommand: npm install --global pnpm@9.12.0 && pnpm install --frozen-lockfile && pnpm build:schemas && pnpm -F @db/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      # Postgres connection string (for example from a free Neon project) so data survives restarts.
      # Empty: a SQLite file on the free plan's temporary disk, wiped on every restart.
      - key: DATABASE_URL
        sync: false
      # JSON with your own OAuth clients and secrets, e.g. the help-desk client that reads Contact a person messages.
      - key: PARTNER_CLIENTS
        sync: false
      # Required in production: RSA private key (PKCS8 PEM) that signs LTI messages. Paste the whole key; multi-line is fine.
      # Make one with: node -e "console.log(require('crypto').generateKeyPairSync('rsa',{modulusLength:2048,privateKeyEncoding:{type:'pkcs8',format:'pem'},publicKeyEncoding:{type:'spki',format:'pem'}}).privateKey)"
      - key: LTI_TOOL_PRIVATE_KEY_PEM
        sync: false
      # Demo only: start with a temporary LTI key when LTI_TOOL_PRIVATE_KEY_PEM is empty. Remove for real use.
      - key: LTI_ALLOW_EPHEMERAL_KEY
        value: "true"
      # Read aloud voices for any language: mms (open source, needs HF_TOKEN) or custom (TTS_URL). See README.
      - key: TTS_PROVIDER
        sync: false
      - key: HF_TOKEN
        sync: false
      # Where SMS resume links point, e.g. https://<your-vercel-site>/pages/signup.html
      - key: PUBLIC_RESUME_URL
        sync: false
